<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الأسماء الخمسة - الصف الثاني الثانوي | أ/ نور الدين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#9a3412; --primary-light:#ea580c; --secondary:#7c2d12;
  --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --dark:#1c1917; --card-bg:#ffffff;
}
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background-color:#fff7ed;background-image:radial-gradient(#fdba74 1.5px,transparent 1.5px);background-size:25px 25px;color:var(--dark);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.hidden{display:none!important}

/* Header */
.header-main{background:linear-gradient(135deg,#1c0a03,#7c2d12,#c2410c);color:#fff;padding:28px 16px 90px;text-align:center;position:relative;margin-bottom:20px}
.header-content{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,45px);flex-wrap:wrap}
.teacher-photo{width:clamp(160px,46vw,250px);height:clamp(160px,46vw,250px);border-radius:50%;border:5px solid #fbbf24;box-shadow:0 0 0 8px rgba(251,191,36,.25),0 10px 25px rgba(0,0,0,.5);object-fit:cover;object-position:center top;background:#fff;flex-shrink:0}
.header-texts{display:flex;flex-direction:column;align-items:center}
.series{font-size:clamp(1rem,4vw,1.4rem);font-weight:800;color:#fed7aa;background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.45);padding:5px 18px;border-radius:30px;margin-bottom:8px}
.teacher-name{font-size:clamp(2.4rem,11vw,4.3rem);font-weight:900;background:linear-gradient(to right,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 4px 6px rgba(0,0,0,.5));line-height:1.2;margin-bottom:4px}
.teacher-role{font-size:clamp(1rem,3.5vw,1.25rem);font-weight:700;color:#ffedd5;margin-bottom:10px}
.header-main h2{font-size:clamp(.95rem,3.4vw,1.25rem);font-weight:700;color:#fff7ed;margin-bottom:8px;line-height:1.7}
.lesson-pill{font-size:clamp(.9rem,3vw,1.1rem);font-weight:700;background:rgba(0,0,0,.35);display:inline-block;padding:6px 20px;border-radius:30px;border:1px solid rgba(255,255,255,.2)}
.header-wave{position:absolute;bottom:-1px;left:0;width:100%;height:auto;z-index:1}

/* Buttons */
.btn{background:linear-gradient(to bottom,var(--primary-light),var(--primary));color:#fff;border:none;padding:12px 20px;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 6px rgba(0,0,0,.1);border-bottom:3px solid rgba(0,0,0,.3);line-height:1.6}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);border-bottom:0;margin-top:3px}
.btn-correct{background:linear-gradient(to bottom,#34d399,#059669)!important;pointer-events:none}
.btn-wrong{background:linear-gradient(to bottom,#f87171,#dc2626)!important;pointer-events:none}

/* Home */
#home-screen{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center}
.grid-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;width:100%;max-width:1000px;padding-bottom:60px}
.menu-card{background:var(--card-bg);border-radius:20px;padding:26px 18px;text-align:center;box-shadow:0 10px 15px -3px rgba(0,0,0,.06);cursor:pointer;transition:all .3s cubic-bezier(.175,.885,.32,1.275);border:2px solid transparent;position:relative;overflow:hidden}
.menu-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--primary),var(--warning))}
.menu-card:hover{transform:translateY(-6px);border-color:rgba(234,88,12,.35)}
.icon-container{width:78px;height:78px;margin:0 auto 14px;background:linear-gradient(135deg,#ffedd5,#fed7aa);border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon-container svg{width:38px;height:38px;stroke:#9a3412;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-card h3{font-size:1.35rem;font-weight:800;margin-bottom:6px}
.menu-card p{font-size:.98rem;color:#78716c;font-weight:600}
.menu-card .count{display:inline-block;margin-top:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:800;font-size:.85rem;padding:2px 12px;border-radius:20px}

/* Game */
#game-screen{flex:1;display:flex;flex-direction:column}
.game-nav{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(0,0,0,.05);border-radius:0 0 20px 20px;margin-bottom:18px;font-weight:800;font-size:clamp(.85rem,3.2vw,1.15rem)}
.back-btn{background:#e7e5e4;color:var(--dark);border-bottom:3px solid #d6d3d1;padding:6px 14px;font-size:1rem}
#game-progress{background:var(--primary-light);color:#fff;padding:5px 14px;border-radius:20px;white-space:nowrap}
.game-container{flex:1;padding:0 14px 40px;max-width:900px;margin:0 auto;width:100%;display:flex;flex-direction:column}
.question-box{background:#fff;padding:18px 20px;border-radius:16px;text-align:center;font-size:clamp(1.1rem,4.3vw,1.55rem);font-weight:800;color:#7c2d12;margin-bottom:20px;box-shadow:0 10px 15px -3px rgba(0,0,0,.06);border-right:8px solid var(--primary-light);line-height:1.8}
.shake{animation:shake .5s both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

.options-grid{display:flex;flex-direction:column;gap:13px}
.options-grid .btn{padding:15px;font-size:clamp(1.02rem,3.8vw,1.3rem);text-align:right;justify-content:flex-start}
.tf-grid{display:flex;gap:16px;justify-content:center}
.tf-grid .btn{flex:1;font-size:clamp(1.5rem,6vw,2rem);padding:24px 10px}

/* Bubbles */
.bubbles-area{position:relative;height:400px;background:linear-gradient(to bottom,#1c0a03,#9a3412);border-radius:16px;overflow:hidden;border:4px solid #fb923c;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.bubble{position:absolute;background:radial-gradient(circle at 30% 30%,#fff,#ffedd5);color:#7c2d12;border:2px solid #fff;padding:10px 4px;border-radius:26px;font-weight:800;font-size:clamp(.8rem,2.8vw,1.05rem);line-height:1.5;box-shadow:0 10px 15px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;width:23%;z-index:5}
.hint{text-align:center;margin-top:14px;color:var(--primary);font-weight:800;font-size:1.02rem}

/* Shooting */
.shooting-area{position:relative;height:420px;background:radial-gradient(circle at 20% 30%,#fed7aa 0 60px,transparent 61px),radial-gradient(circle at 80% 65%,#fed7aa 0 80px,transparent 81px),#fffbeb;border-radius:16px;overflow:hidden;border:4px solid #fb923c}
.target-bird{position:absolute;background:#fff;color:var(--dark);padding:8px 14px;border-radius:24px;font-weight:800;font-size:clamp(.85rem,3.2vw,1.1rem);line-height:1.5;box-shadow:0 8px 15px rgba(0,0,0,.15);cursor:crosshair;border:3px solid var(--warning);display:flex;align-items:center;gap:6px;max-width:82%;white-space:normal}
.target-bird svg{flex-shrink:0}

/* Genius */
.genius-wrap{background:linear-gradient(135deg,#431407,#9a3412,#ea580c);border-radius:16px;padding:16px;margin-bottom:16px;border:4px solid #fdba74}
.genius-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(253,224,71,.15);color:#fde047;font-weight:800;padding:5px 15px;border-radius:20px;border:1px solid rgba(253,224,71,.4);margin-bottom:12px}
.genius-timer-track{width:100%;height:14px;background:rgba(0,0,0,.35);border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.2)}
.genius-timer-bar{height:100%;width:100%;background:linear-gradient(to right,#fde047,#f59e0b,#ef4444);transition:width .1s linear}
.genius-options{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:600px){.genius-options{grid-template-columns:1fr}}
.genius-options .btn{padding:14px 10px;font-size:clamp(1rem,3.6vw,1.2rem);background:linear-gradient(to bottom,#fb923c,#c2410c);border-bottom:3px solid #7c2d12;border-radius:14px;min-height:64px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.75);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.active{opacity:1;pointer-events:all}
.modal{background:#fff;padding:34px 24px;border-radius:25px;text-align:center;width:min(90%,400px);transform:scale(.7);transition:all .4s cubic-bezier(.175,.885,.32,1.275)}
.overlay.active .modal{transform:scale(1)}
.modal-icon{display:flex;justify-content:center;margin-bottom:16px}
#feedback-title{font-size:clamp(1.7rem,7vw,2.3rem);font-weight:900}

.errors-list{margin-top:22px;text-align:right;background:#fafaf9;padding:16px;border-radius:15px;border:2px solid #e7e5e4;max-height:360px;overflow-y:auto}

/* Footer */
.footer-main{background:var(--dark);color:#d6d3d1;text-align:center;padding:22px 16px;margin-top:auto;border-top:4px solid var(--primary-light)}
.footer-main p{margin:4px 0;font-size:1.05rem;font-weight:700}
.footer-main a{color:#fbbf24;text-decoration:none;font-weight:800;direction:ltr;display:inline-block}

.confetti{position:fixed;top:-10px;width:12px;height:12px;z-index:9999;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>

// ===== الصوت =====
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio(){ try{ if(!audioCtx) audioCtx = new AC(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function playTone(f,type,d,v=.1){ if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type; o.frequency.setValueAtTime(f,audioCtx.currentTime); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }
function playCorrect(){ initAudio(); [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',i===3?.4:.15,.12),i*100)); triggerConfetti(); }
function playWrong(){ initAudio(); playTone(300,'sawtooth',.15,.1); setTimeout(()=>playTone(200,'sawtooth',.25,.13),150);
  const b=document.querySelector('.question-box'); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } }
function triggerConfetti(){ const c=['#f97316','#fbbf24','#10b981','#38bdf8','#a855f7']; for(let i=0;i<36;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.backgroundColor=c[i%c.length]; d.style.animationDuration=(Math.random()*2+1)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),3000);} }
const shuffleArray = a => a.map(v=>({s:Math.random(),v})).sort((x,y)=>x.s-y.s).map(x=>x.v);

const ICON_OK='<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
const ICON_NO='<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
function showFeedback(ok, cb){
  const m=document.getElementById('feedback-modal'), t=document.getElementById('feedback-title');
  if(ok){ playCorrect(); t.textContent='إجابة صحيحة، بطل!'; t.style.color='var(--success)'; }
  else { playWrong(); t.textContent='إجابة خاطئة!'; t.style.color='var(--danger)'; }
  document.getElementById('feedback-icon').innerHTML = ok?ICON_OK:ICON_NO;
  m.classList.add('active');
  setTimeout(()=>{ m.classList.remove('active'); cb&&cb(); },1300);
}

// ===== المحرك =====
let currentGame=null, currentQuestions=[], qIndex=0, animInterval=null, geniusTimerInterval=null, wrongAnswers=[];
function stopTimers(){ clearInterval(animInterval); clearInterval(geniusTimerInterval); }

function initApp(){
  const g=document.getElementById('menu-grid'); g.innerHTML='';
  allGamesData.forEach(game=>{
    const c=document.createElement('div'); c.className='menu-card';
    c.innerHTML=`<div class="icon-container">${game.icon}</div><h3>${game.title}</h3><p>${game.desc}</p><span class="count">${game.questions.length} سؤالًا</span>`;
    c.onclick=()=>startGame(game); g.appendChild(c);
  });
  document.body.addEventListener('touchstart',initAudio,{once:true});
  document.body.addEventListener('click',initAudio,{once:true});
}
function toggleHome(show){
  ['home-screen','main-header','main-footer'].forEach(id=>document.getElementById(id).classList.toggle('hidden',!show));
  document.getElementById('game-screen').classList.toggle('hidden',show);
  window.scrollTo(0,0);
}
function returnToMenu(){ stopTimers(); toggleHome(true); }
function startGame(game){
  initAudio(); currentGame=game; currentQuestions=shuffleArray([...game.questions]); qIndex=0; wrongAnswers=[];
  document.getElementById('game-title').innerText=game.title; toggleHome(false); renderNextState();
}
function next(){ qIndex++; renderNextState(); }
function answer(ok, qData, correct, selected){
  if(!ok) wrongAnswers.push({question:qData.q, correct, selected});
  showFeedback(ok, next);
}
function renderNextState(){
  stopTimers();
  if(qIndex>=currentQuestions.length) return gameComplete();
  const gc=document.getElementById('game-container'); gc.innerHTML='';
  document.getElementById('game-progress').innerText=`${qIndex+1} / ${currentQuestions.length}`;
  ({mcq:renderMCQ, bubbles:renderBubbles, shooting:renderShooting, true_false:renderTrueFalse, genius:renderGenius})[currentGame.type](gc);
}
function qBox(text){ const b=document.createElement('div'); b.className='question-box'; b.innerText=text; return b; }
function hintEl(html){ const h=document.createElement('div'); h.className='hint'; h.innerHTML=html; return h; }

function gameComplete(){
  const gc=document.getElementById('game-container'); playCorrect(); setTimeout(playCorrect,300);
  const total=currentQuestions.length, score=total-wrongAnswers.length;
  let s='';
  if(wrongAnswers.length){
    s=`<div class="errors-list"><h3 style="color:var(--danger);margin-bottom:14px;text-align:center;font-size:1.3rem">الأسئلة التي أخطأت فيها 📝</h3><ul style="list-style:none;display:flex;flex-direction:column;gap:13px">`+
      wrongAnswers.map((w,i)=>`<li style="background:#fff;padding:13px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.05);border-right:5px solid var(--danger)">
        <div style="font-weight:800;color:var(--primary);margin-bottom:6px;line-height:1.7">${i+1}. ${w.question}</div>
        <div style="color:#78716c;margin-bottom:4px">إجابتك: <span style="color:var(--danger);text-decoration:line-through">${w.selected}</span></div>
        <div style="color:var(--success);font-weight:800">الإجابة الصحيحة: ${w.correct}</div></li>`).join('')+`</ul></div>`;
  } else s=`<p style="color:var(--success);font-size:1.4rem;font-weight:800;margin-top:18px">أداء مثالي! لم تخطئ في أي سؤال 🌟</p>`;
  gc.innerHTML=`<div style="text-align:center;padding:32px 16px;background:#fff;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.1)">
    <div style="font-size:4rem">🏆</div>
    <h2 style="color:var(--primary);margin-bottom:8px;font-size:2rem;font-weight:900">انتهت اللعبة!</h2>
    <p style="font-size:1.35rem;color:#57534e;font-weight:800">نتيجتك: ${score} من ${total}</p>${s}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
      <button class="btn" onclick="startGame(currentGame)">إعادة اللعبة</button>
      <button class="btn back-btn" onclick="returnToMenu()">القائمة الرئيسية</button></div></div>`;
}

// 1) اختيار من متعدد
function renderMCQ(c){
  const d=currentQuestions[qIndex], correct=d.options[d.ans]; let done=false;
  const box=document.createElement('div'); box.className='options-grid';
  shuffleArray([...d.options]).forEach(opt=>{
    const b=document.createElement('button'); b.className='btn'; b.innerText=opt;
    b.onclick=()=>{ if(done) return; done=true; const ok=opt===correct; b.classList.add(ok?'btn-correct':'btn-wrong'); answer(ok,d,correct,opt); };
    box.appendChild(b);
  });
  c.append(qBox(d.q), box);
}

// 2) صح أم خطأ
function renderTrueFalse(c){
  const d=currentQuestions[qIndex], correct=d.options[d.ans]; let done=false;
  const box=document.createElement('div'); box.className='tf-grid';
  ["صح","خطأ"].forEach(opt=>{
    const b=document.createElement('button'); b.className='btn'; b.innerText=opt;
    b.style.background = opt==="صح" ? "linear-gradient(to bottom,#10b981,#059669)" : "linear-gradient(to bottom,#ef4444,#dc2626)";
    b.onclick=()=>{ if(done) return; done=true; const ok=opt===correct; b.style.filter=ok?'brightness(1.15)':'brightness(.8)'; b.style.pointerEvents='none'; answer(ok,d,correct,opt); };
    box.appendChild(b);
  });
  c.append(qBox(d.q), box);
}

// 3) الفقاعات المتساقطة
function renderBubbles(c){
  const d=currentQuestions[qIndex], correct=d.options[d.ans]; let done=false;
  const area=document.createElement('div'); area.className='bubbles-area';
  c.append(qBox(d.q), area, hintEl('💡 اضغط على الفقاعة التي تحمل الإجابة الصحيحة قبل أن تسقط!'));
  const H=area.clientHeight||400;
  const bubbles=shuffleArray([...d.options]).map((opt,i)=>{
    const el=document.createElement('div'); el.className='bubble'; el.innerHTML=`<span>${opt}</span>`;
    el.style.left=(1.5+i*24.5)+'%'; const top=-90-Math.random()*90; el.style.top=top+'px';
    el.onclick=()=>{ if(done) return; done=true; stopTimers(); const ok=opt===correct;
      el.style.background=ok?'var(--success)':'var(--danger)'; el.style.color='#fff'; answer(ok,d,correct,opt); };
    area.appendChild(el);
    return {el, top, speed:.55+Math.random()*.45, ok:opt===correct, active:true};
  });
  animInterval=setInterval(()=>{
    if(done) return;
    bubbles.forEach(b=>{
      if(!b.active) return;
      b.top+=b.speed; b.el.style.top=b.top+'px'; b.el.style.transform=`translateX(${Math.sin(b.top/20)*4}px)`;
      if(b.top>H){ b.active=false; b.el.style.display='none';
        if(b.ok && !done){ done=true; stopTimers(); answer(false,d,correct,'سقطت دون اختيار'); } }
    });
  },30);
}

// 4) التنشين والاصطياد (مؤقت واحد يحرّك كل الأهداف)
function renderShooting(c){
  const d=currentQuestions[qIndex], correct=d.options[d.ans]; let done=false;
  const area=document.createElement('div'); area.className='shooting-area';
  c.append(qBox(d.q), area, hintEl('🎯 اضغط على الإجابة الصحيحة وهي تتحرك لاصطيادها!'));
  const W=area.clientWidth;
  const birds=shuffleArray([...d.options]).map((opt,i)=>{
    const el=document.createElement('div'); el.className='target-bird';
    el.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>${opt}</span>`;
    el.style.top=(5+i*24)+'%';
    el.onclick=()=>{ if(done) return; done=true; stopTimers(); const ok=opt===correct;
      el.style.background=ok?'var(--success)':'var(--danger)'; el.style.color='#fff'; el.style.borderColor='#fff'; answer(ok,d,correct,opt); };
    area.appendChild(el);
    const dir = i%2===0 ? 1 : -1;
    return {el, dir, pos: dir===1 ? -el.offsetWidth*0.6 : W-el.offsetWidth*0.4, speed:(Math.random()*.9+.8)};
  });
  animInterval=setInterval(()=>{
    if(done) return;
    birds.forEach(b=>{
      const w=b.el.offsetWidth; b.pos+=b.speed*b.dir;
      if(b.dir===1 && b.pos>W) b.pos=-w;
      if(b.dir===-1 && b.pos<-w) b.pos=W;
      b.el.style.left=b.pos+'px';
    });
  },25);
}

// 5) تحدي العباقرة
function renderGenius(c){
  const d=currentQuestions[qIndex], correct=d.options[d.ans]; let done=false;
  const wrap=document.createElement('div'); wrap.className='genius-wrap';
  wrap.innerHTML=`<div class="genius-badge">🧠 تحدي العباقرة</div><div class="genius-timer-track"><div class="genius-timer-bar"></div></div>`;
  const bar=wrap.querySelector('.genius-timer-bar');
  const box=document.createElement('div'); box.className='genius-options';
  const TOTAL=20000, start=Date.now();
  const finish=(ok,sel)=>{ if(done) return; done=true; stopTimers(); answer(ok,d,correct,sel||'انتهى الوقت!'); };
  shuffleArray([...d.options]).forEach(opt=>{
    const b=document.createElement('button'); b.className='btn'; b.innerText=opt;
    b.onclick=()=>{ if(done) return; const ok=opt===correct; b.classList.add(ok?'btn-correct':'btn-wrong'); finish(ok,opt); };
    box.appendChild(b);
  });
  c.append(wrap, qBox(d.q), box);
  geniusTimerInterval=setInterval(()=>{
    const el=Date.now()-start; bar.style.width=Math.max(0,100-el/TOTAL*100)+'%';
    if(el>=TOTAL) finish(false,null);
  },80);
}

window.onload=initApp;
</script>
